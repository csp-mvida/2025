<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSP | Central de Solicitação de Pagamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#ffffff', // Branco
              surface: '#ffffff',    // Branco
              detail: '#efefef',     // Detalhe 3 (Cinza claro)
              primary: '#008b5a',    // Cor Principal
              primaryHover: '#03c17e', // Cor Detalhe (Hover/Bright)
              primaryDark: '#04724b', // Cor Detalhe 2 (Darker)
              accent: '#f59e0b',     // Amber 500
              danger: '#dc2626',     // Red 600 (Darker for light mode)
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            },
            fontFamily: {
              sans: ['Montserrat', 'system-ui', 'sans-serif'],
              heading: ['Montserrat', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: 'Montserrat', sans-serif !important;
        background-color: #ffffff;
        color: #1e293b;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Animações customizadas */
      @keyframes slideInUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-fade-up {
        animation: slideInUp 0.8s ease-out forwards;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
